name: Verify frozen CP7 UI in GitHub Actions

on:
  push:
    branches:
      - sync/cp7-checkpoint-import
    paths:
      - .github/workflows/verify-cp7-ui.yml

permissions: {}

concurrency:
  group: frozen-cp7-ui-validation
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'ncut-d1z/Insect-Inspired' &&
      github.ref == 'refs/heads/sync/cp7-checkpoint-import' &&
      github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GIT_TERMINAL_PROMPT: '0'
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_NO_REPLACE_OBJECTS: '1'
      GIT_ALTERNATE_OBJECT_DIRECTORIES: ''
    steps:
      - name: Verify frozen inputs, execute identical UI checks, and publish raw evidence
        shell: bash
        env:
          IMPORT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          readonly REMOTE='https://github.com/ncut-d1z/Insect-Inspired.git'
          readonly SYNC_REF='refs/heads/sync/cp7-checkpoint-import'
          [[ "$GITHUB_REPOSITORY" == 'ncut-d1z/Insect-Inspired' ]]
          [[ "$GITHUB_REF" == "$SYNC_REF" && "$GITHUB_EVENT_NAME" == 'push' ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          command -v git >/dev/null
          command -v python3 >/dev/null
          command -v node >/dev/null
          command -v npm >/dev/null
          chrome_bin="$(command -v google-chrome)"
          [[ -x "$chrome_bin" ]]
          font_logs="$(mktemp -d "$RUNNER_TEMP/cp7-cjk-fonts.XXXXXX")"
          sudo apt-get update -qq 2>&1 | tee "$font_logs/apt-update.log"
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk 2>&1 | tee "$font_logs/apt-install.log"
          fc-match ':lang=zh-cn' | tee "$font_logs/fc-match-zh-cn.txt"
          dpkg-query --show fonts-noto-cjk > "$font_logs/package-version.txt"
          python3 - "$font_logs" <<'PYFONT'
          import pathlib, sys
          selected=(pathlib.Path(sys.argv[1])/'fc-match-zh-cn.txt').read_text().strip()
          assert 'Noto' in selected and 'CJK' in selected, 'Expected Noto CJK for zh-cn'
          print('CI CJK font confirmed:', selected)
          PYFONT
          set +x
          auth_header="$(printf 'x-access-token:%s' "$IMPORT_TOKEN" | base64 -w 0)"
          printf '::add-mask::%s\n' "$auth_header"
          export GIT_CONFIG_COUNT=3
          export GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth_header"
          export GIT_CONFIG_KEY_1='core.hooksPath'
          export GIT_CONFIG_VALUE_1='/dev/null'
          export GIT_CONFIG_KEY_2='push.followTags'
          export GIT_CONFIG_VALUE_2='false'
          unset IMPORT_TOKEN auth_header
          work="$(mktemp -d "$RUNNER_TEMP/cp7-ui.XXXXXX")"
          input_git="$work/input.git"
          runtime_dir="$work/runtime"
          html_repo="$work/html-repository"
          result_dir="$work/ui-results"
          git init --bare --quiet "$input_git"
          git --git-dir="$input_git" fetch --quiet --no-tags --depth=1 "$REMOTE" "$GITHUB_SHA"
          [[ "$(git --git-dir="$input_git" rev-parse FETCH_HEAD)" == "$GITHUB_SHA" ]]
          python3 - "$input_git" "$GITHUB_SHA" "$work" <<'PYINPUT'
          import gzip, hashlib, json, pathlib, subprocess, sys
          repo, commit, root = sys.argv[1:]
          root = pathlib.Path(root)
          prefix = 'temp/sync/CP-0007/ui-input/'
          def blob(path):
              return subprocess.check_output(['git','--git-dir='+repo,'cat-file','blob',commit+':'+path])
          def unique_keys(items):
              out = {}
              for k,v in items:
                  assert k not in out, 'Duplicate JSON key'
                  out[k] = v
              return out
          raw = blob(prefix+'manifest.json')
          assert hashlib.sha256(raw).hexdigest() == '250540fe577e7c38ac464c2dba26704096f51486c5ee0c4c16721e6db6a564aa'
          m = json.loads(raw, object_pairs_hook=unique_keys)
          assert m['format_version']==1 and m['repository']=='ncut-d1z/Insect-Inspired'
          assert m['scope_id']=='SCOPE-0001' and m['checkpoint_id']=='CP-0007'
          assert m['purpose']=='ui_validation_input_only'
          assert m['source_sync_ref']=='refs/heads/sync/cp7-checkpoint-import'
          assert m['full_research_snapshot'] is False and m['local_browser_execution_succeeded'] is False
          assert m['html']['path']=='ref.html' and m['html']['bytes']==47780202
          assert m['html']['sha256']=='9a07565ca74d1d039426cb11cde5603259995f89c71565b4136d57469c0c6982'
          assert m['test_script']=={'path':'scripts/html-smoke.mjs','bytes':7227,'sha256':'9a927248fff3f66f521e75bbcde9a9b18c6cf73ef07294a358d0f7b7de11830a','byte_identical_to_source':True}
          assert m['playwright_version']=='1.62.1' and m['expected_ui_check_count']==10
          assert m['compression']=={'format':'gzip','level':9,'mtime':0,'name':'ref.html.gz','bytes':5060987,'sha256':'21b987c73166fd560d5190056882375d573c6e5bb1f0d76f6662c74f53d70831'}
          assert m['part_size_bytes']==524288
          assert m['readme_sha256']=='821e6495bb9767aeba9bc45166ccea7051cee39997bcc586b0cac5765ff2789f'
          assert hashlib.sha256(blob(prefix+'README.md')).hexdigest()==m['readme_sha256']
          parts=m['parts']
          assert isinstance(parts,list) and len(parts)==10
          expected_paths=set()
          digest=hashlib.sha256()
          total=0
          compressed=root/'ref.html.gz'
          with compressed.open('xb') as output:
              for ordinal,part in enumerate(parts,1):
                  assert part['index']==ordinal
                  path='parts/ref.html.gz.part-'+format(ordinal,'04d')
                  assert part['path']==path and path not in expected_paths
                  expected_paths.add(path)
                  data=blob(prefix+path)
                  assert len(data)==part['bytes'] and 0<len(data)<=524288
                  assert ordinal==len(parts) or len(data)==524288
                  assert hashlib.sha256(data).hexdigest()==part['sha256']
                  output.write(data);digest.update(data);total+=len(data)
          assert total==5060987 and digest.hexdigest()=='21b987c73166fd560d5190056882375d573c6e5bb1f0d76f6662c74f53d70831'
          actual=subprocess.check_output(['git','--git-dir='+repo,'ls-tree','-r','-z','--name-only',commit,'--',prefix+'parts/'])
          assert {x.decode()[len(prefix):] for x in actual.split(b'\0') if x}==expected_paths
          with compressed.open('rb') as stream:
              assert stream.read(10)[:8]==b'\x1f\x8b\x08\x00\x00\x00\x00\x00'
          html_dir=root/'html-repository'
          html_dir.mkdir()
          digest=hashlib.sha256();total=0
          with gzip.open(compressed,'rb') as source,(html_dir/'ref.html').open('xb') as output:
              while data:=source.read(1024*1024):
                  total+=len(data);assert total<=47780202
                  output.write(data);digest.update(data)
          assert total==47780202 and digest.hexdigest()=='9a07565ca74d1d039426cb11cde5603259995f89c71565b4136d57469c0c6982'
          script=blob('scripts/html-smoke.mjs')
          assert len(script)==7227 and hashlib.sha256(script).hexdigest()=='9a927248fff3f66f521e75bbcde9a9b18c6cf73ef07294a358d0f7b7de11830a'
          runtime=root/'runtime'
          (runtime/'scripts').mkdir(parents=True)
          (runtime/'scripts/html-smoke.mjs').write_bytes(script)
          (root/'input-manifest.json').write_bytes(raw)
          print(json.dumps({'stage':'fixed_ui_input_verified','input_commit':commit,
                            'html_sha256':'9a07565ca74d1d039426cb11cde5603259995f89c71565b4136d57469c0c6982','script_sha256':'9a927248fff3f66f521e75bbcde9a9b18c6cf73ef07294a358d0f7b7de11830a',
                            'gzip_sha256':'21b987c73166fd560d5190056882375d573c6e5bb1f0d76f6662c74f53d70831','parts':len(parts)}))
          PYINPUT
          export PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
          npm --prefix "$runtime_dir" install --ignore-scripts --no-audit --no-fund --package-lock=false 'playwright@1.62.1'
          export CODEX_PRIMARY_RUNTIME_NODE_MODULES="$runtime_dir/node_modules"
          node -e "const p=require(process.env.CODEX_PRIMARY_RUNTIME_NODE_MODULES+'/playwright/package.json');if(p.version!=='1.62.1')throw Error('Playwright version differs');console.log('Playwright',p.version)"
          node --version > "$work/node-version.txt"
          "$chrome_bin" --version > "$work/chrome-version.txt"
          node "$runtime_dir/scripts/html-smoke.mjs" --html "$html_repo/ref.html" --out-dir "$result_dir" --checkpoint CP-0007 --executable-path "$chrome_bin"
          python3 - "$input_git" "$GITHUB_SHA" "$work" "$font_logs" <<'PYRESULT'
          import datetime, hashlib, json, os, pathlib, shutil, subprocess, sys
          repo, commit, root, font_logs = sys.argv[1:]
          font_logs=pathlib.Path(font_logs)
          root=pathlib.Path(root);results=root/'ui-results'
          def h(data):return hashlib.sha256(data).hexdigest()
          names=['ui-audit-final.json','html-browser-check.json','html-desktop.png','html-topic.png','html-mobile.png','html-mobile-controls.png']
          assert {p.name for p in results.iterdir()}==set(names)
          raw=(results/'ui-audit-final.json').read_bytes()
          assert raw==(results/'html-browser-check.json').read_bytes()
          report=json.loads(raw)
          expected={'ten_fixed_tables','search_and_theme','abstract_expand_collapse','evidence_expand_collapse','back_to_top','clear','counter_evidence_filter','year_sort','mobile_no_document_overflow','no_javascript_errors'}
          assert report['checkpoint_id']=='CP-0007' and report['passed'] is True
          assert set(report['checks'])==expected and all(v is True for v in report['checks'].values())
          assert report['errors']==[] and report['input_changed'] is False
          assert report['html_sha256']==report['html_sha256_after']=='9a07565ca74d1d039426cb11cde5603259995f89c71565b4136d57469c0c6982'
          assert report['html_bytes']==47780202
          assert h((root/'html-repository/ref.html').read_bytes())=='9a07565ca74d1d039426cb11cde5603259995f89c71565b4136d57469c0c6982'
          assert h((root/'runtime/scripts/html-smoke.mjs').read_bytes())=='9a927248fff3f66f521e75bbcde9a9b18c6cf73ef07294a358d0f7b7de11830a'
          for name in names[2:]:
              assert (results/name).read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
          manifest=(root/'input-manifest.json').read_bytes()
          assert h(manifest)=='250540fe577e7c38ac464c2dba26704096f51486c5ee0c4c16721e6db6a564aa'
          target='temp/sync/CP-0007/ui-evidence-cjk/'
          old=subprocess.check_output(['git','--git-dir='+repo,'ls-tree','-r','--name-only',commit,'--',target])
          assert not old.strip(), 'Existing evidence must be preserved; inspect before publishing another run'
          evidence=root/'evidence'
          evidence.mkdir()
          for name in names:shutil.copyfile(results/name,evidence/name)
          (evidence/'manifest.json').write_bytes(manifest)
          files=[{'path':name,'bytes':len((evidence/name).read_bytes()),'sha256':h((evidence/name).read_bytes())} for name in names+['manifest.json']]
          receipt={'format_version':1,'status':'passed','checkpoint_id':'CP-0007','execution_environment':'github_actions_ubuntu_24_04','local_browser_execution_succeeded':False,'repository':'ncut-d1z/Insect-Inspired','sync_ref':'refs/heads/sync/cp7-checkpoint-import','input_commit_sha':commit,'actions_run_id':os.environ['GITHUB_RUN_ID'],'actions_run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'actions_run_url':'https://github.com/ncut-d1z/Insect-Inspired/actions/runs/'+os.environ['GITHUB_RUN_ID'],'job':os.environ['GITHUB_JOB'],'runner_os':os.environ['RUNNER_OS'],'html_sha256':'9a07565ca74d1d039426cb11cde5603259995f89c71565b4136d57469c0c6982','html_bytes':47780202,'test_script_path':'scripts/html-smoke.mjs','test_script_sha256':'9a927248fff3f66f521e75bbcde9a9b18c6cf73ef07294a358d0f7b7de11830a','playwright_version':'1.62.1','node_version':(root/'node-version.txt').read_text().strip(),'browser_version':(root/'chrome-version.txt').read_text().strip(),'input_manifest_sha256':'250540fe577e7c38ac464c2dba26704096f51486c5ee0c4c16721e6db6a564aa','check_count':10,'test_started_at_utc':report['started_at_utc'],'test_completed_at_utc':report['completed_at_utc'],'recorded_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),'raw_test_output_modified':False,'full_research_checkpoint_validation':False,'evidence_files':files,'output_commit_parent_sha':commit,'publication_note':'Output commit SHA is printed in Actions logs and summary; this receipt is part of that commit.'}
          font_commands=[(['sudo','apt-get','update','-qq'],'apt-update.log'),(['sudo','apt-get','install','-y','--no-install-recommends','fonts-noto-cjk'],'apt-install.log'),(['fc-match',':lang=zh-cn'],'fc-match-zh-cn.txt')]
          receipt['font_environment']={'environment':'github_actions_ubuntu_24_04','package':'fonts-noto-cjk','installed_package':(font_logs/'package-version.txt').read_text().strip(),'selected_zh_cn_font':(font_logs/'fc-match-zh-cn.txt').read_text().strip(),'noto_cjk_verified':True,'commands':[{'argv':argv,'exit_code':0,'output_sha256':h((font_logs/name).read_bytes()),'output':(font_logs/name).read_text(errors='replace')} for argv,name in font_commands]}
          receipt['evidence_directory']='temp/sync/CP-0007/ui-evidence-cjk/'
          receipt['prior_evidence_preserved']='temp/sync/CP-0007/ui-evidence/'
          (evidence/'actions-receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          expected_paths=[target+name for name in names+['manifest.json','actions-receipt.json']]
          env=os.environ.copy()
          env.update(GIT_INDEX_FILE=str(root/'evidence.index'),GIT_AUTHOR_NAME='github-actions[bot]',GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com',GIT_COMMITTER_NAME='github-actions[bot]',GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com')
          def git(*args,data=None):
              return subprocess.check_output(['git','--git-dir='+repo,*args],input=data,env=env)
          git('read-tree',commit+'^{tree}')
          for name,path in zip(names+['manifest.json','actions-receipt.json'],expected_paths):
              oid=git('hash-object','-w','--stdin',data=(evidence/name).read_bytes()).decode().strip()
              git('update-index','--add','--cacheinfo','100644',oid,path)
          tree=git('write-tree').decode().strip()
          new_commit=git('commit-tree',tree,'-p',commit,'-m','Record CP7 UI checks with Noto CJK in GitHub Actions').decode().strip()
          assert git('show','-s','--format=%P',new_commit).decode().strip()==commit
          actual=git('diff-tree','--no-commit-id','--name-only','-r',commit,new_commit).decode().splitlines()
          assert set(actual)==set(expected_paths) and len(actual)==8
          (root/'output-commit.txt').write_text(new_commit+'\n')
          print(json.dumps({'stage':'raw_ui_evidence_ready','all_ten_checks_passed':True,
                            'input_commit':commit,'output_commit':new_commit,
                            'html_sha256':'9a07565ca74d1d039426cb11cde5603259995f89c71565b4136d57469c0c6982','script_sha256':'9a927248fff3f66f521e75bbcde9a9b18c6cf73ef07294a358d0f7b7de11830a',
                            'actions_run_url':receipt['actions_run_url'],'files':files}))
          PYRESULT
          result_commit="$(cat "$work/output-commit.txt")"
          [[ "$result_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git --git-dir="$input_git" ls-remote --heads "$REMOTE" "$SYNC_REF")" == "$GITHUB_SHA"$'\t'"$SYNC_REF" ]]
          guard="$work/push-guard"
          mkdir "$guard"
          export CP7_UI_PARENT="$GITHUB_SHA" CP7_UI_COMMIT="$result_commit" CP7_UI_REF="$SYNC_REF"
          cat > "$guard/pre-push" <<'PUSHGUARD'
          #!/usr/bin/env bash
          set -euo pipefail
          count=0
          while read -r local_ref local_sha remote_ref remote_sha; do
            count=$((count+1))
            [[ "$count" == 1 && "$local_sha" == "$CP7_UI_COMMIT" ]]
            [[ "$remote_ref" == "$CP7_UI_REF" && "$remote_sha" == "$CP7_UI_PARENT" ]]
          done
          [[ "$count" == 1 ]]
          PUSHGUARD
          chmod 700 "$guard/pre-push"
          git --git-dir="$input_git" -c core.hooksPath="$guard" push --porcelain "$REMOTE" "$result_commit:$SYNC_REF"
          [[ "$(git --git-dir="$input_git" ls-remote --heads "$REMOTE" "$SYNC_REF")" == "$result_commit"$'\t'"$SYNC_REF" ]]
          printf '%s\n' '## CP7 UI checks passed with Noto CJK in GitHub Actions' \
            "Input commit: $GITHUB_SHA" "Evidence commit: $result_commit" \
            'HTML SHA256: 9a07565ca74d1d039426cb11cde5603259995f89c71565b4136d57469c0c6982' 'Test script SHA256: 9a927248fff3f66f521e75bbcde9a9b18c6cf73ef07294a358d0f7b7de11830a' \
            'All 10 original checks passed; raw JSON and four PNG files retained.' \
            'Only the fixed sync ref was updated by a non-force push. No local execution or full-checkpoint acceptance is claimed.' >> "$GITHUB_STEP_SUMMARY"
